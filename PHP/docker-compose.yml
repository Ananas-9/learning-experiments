version: "3"
services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    networks:
      - webnet
  db:
    image: "mysql:latest"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=recepts
      - MYSQL_USER=recepts
      - MYSQL_PASSWORD=recepts
    networks:
      - webnet
networks:
  webnet:
